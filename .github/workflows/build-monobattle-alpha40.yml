name: Build Monobattle Alpha 4.0

on:
  push:
    branches:
      - 'dev/monobattle-v0.1'
    paths:
      - 'tools/prepare_alpha40.py'
      - '.github/workflows/build-monobattle-alpha40.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Alpha 4.0 Galaxy source
        run: python tools/prepare_alpha40.py

      - name: Verify Alpha 4.0 source markers
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('build/MapScript.galaxy').read_text(encoding='utf-8')
          for marker in (
              'MB_SD_FINAL_WAIT_SECONDS = 3.0',
              'gv_mbSDPostPickWait',
              'ALL PICKS LOCKED',
              'DialogControlSetVisible(gv_mbVoteBlindButton, PlayerGroupAll(), false)',
              '24개 후보 · ABBAABBA 스네이크 픽 · 15초 제한',
              '종족 선택 즉시 추첨 · Random 선택 시 리롤 1회',
              'gt_MBTestConstructBoost_Func',
              'TriggerAddEventUnitConstructProgress',
              'UnitSetProgressComplete(u, 1, 85)'
          ):
              assert marker in s, marker
          assert '✓ 선택됨' not in s
          print('Alpha 4.0 source verified')
          PY

      - name: Build StormLib v9.40
        run: |
          git clone --depth 1 --branch v9.40 https://github.com/ladislav-zezula/StormLib.git _StormLib
          cmake -S _StormLib -B _StormLib/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/_storm" \
            -DBUILD_SHARED_LIBS=ON \
            -DSTORM_USE_BUNDLED_LIBRARIES=ON \
            -DSTORM_BUILD_TESTS=OFF
          cmake --build _StormLib/build --config Release -j2
          cmake --install _StormLib/build

      - name: Compile MPQ helper
        run: |
          cc tools/mpq_replace.c \
            -I"$PWD/_storm/include" \
            -L"$PWD/_storm/lib" \
            -Wl,-rpath,"$PWD/_storm/lib" \
            -lstorm -lz \
            -o tools/mpq_replace

      - name: Build Alpha 4.0 map
        run: |
          mkdir -p dist
          OUT='dist/Monobattle - 열대 해안 - Alpha4.0 TEST.SC2Map'
          cp 'Tropic Shores 0.136.SC2Map' "$OUT"
          tools/mpq_replace "$OUT" 'overlay/koKR.SC2Data/LocalizedData/GameStrings.txt' 'koKR.SC2Data\LocalizedData\GameStrings.txt'
          tools/mpq_replace "$OUT" 'overlay/enUS.SC2Data/LocalizedData/GameStrings.txt' 'enUS.SC2Data\LocalizedData\GameStrings.txt'
          tools/mpq_replace "$OUT" 'build/MapScript.galaxy' 'MapScript.galaxy'

      - name: Verify packaged MPQ
        run: |
          python -m pip install --disable-pip-version-check mpyq
          python - <<'PY'
          from mpyq import MPQArchive
          p = 'dist/Monobattle - 열대 해안 - Alpha4.0 TEST.SC2Map'
          raw = MPQArchive(p).extract()
          files = {(k.decode('utf-8','replace') if isinstance(k,bytes) else str(k)).replace('\\','/'): bytes(v) for k,v in raw.items()}
          s = files['MapScript.galaxy'].decode('utf-8-sig')
          for marker in (
              'MB_SD_FINAL_WAIT_SECONDS = 3.0', 'gv_mbSDPostPickWait',
              'TriggerAddEventUnitConstructProgress', 'UnitSetProgressComplete(u, 1, 85)',
              '24개 후보 · ABBAABBA 스네이크 픽 · 15초 제한'
          ):
              assert marker in s, marker
          assert '✓ 선택됨' not in s
          print('Alpha 4.0 packaged MPQ verified')
          PY

      - name: Upload Alpha 4.0 map
        uses: actions/upload-artifact@v4
        with:
          name: monobattle-tropic-shores-alpha40-test
          path: 'dist/Monobattle - 열대 해안 - Alpha4.0 TEST.SC2Map'
          if-no-files-found: error
          retention-days: 7
