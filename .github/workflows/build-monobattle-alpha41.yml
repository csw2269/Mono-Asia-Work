name: Build Monobattle Alpha 4.1

on:
  push:
    branches:
      - 'dev/monobattle-v0.1'
    paths:
      - 'tools/prepare_alpha41.py'
      - 'overlay/Base.SC2Data/GameData/AbilData.xml'
      - '.github/workflows/build-monobattle-alpha41.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Alpha 4.1 Galaxy source
        run: python tools/prepare_alpha41.py

      - name: Verify Alpha 4.1 source markers
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('build/MapScript.galaxy').read_text(encoding='utf-8')
          for marker in (
              'bool gv_mbVoteLocked',
              '모든 플레이어 투표 완료 · 선택 잠금 · 3초 후 확정',
              '"CinematicLabel"',
              '"DirectiveDisplay"',
              'int[24] gv_mbSDPickBadge',
              'int[24] gv_mbSDPickedBy',
              'gv_mbSDPickedBy[slot] = player',
              '[BLUE] P',
              '[RED] P',
              'MB_SD_FINAL_WAIT_SECONDS = 3.0'
          ):
              assert marker in s, marker
          assert '✓ 선택됨' not in s
          print('Alpha 4.1 Galaxy source verified')
          PY

      - name: Verify TEST morph data
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          p = Path('overlay/Base.SC2Data/GameData/AbilData.xml')
          root = ET.fromstring(p.read_text(encoding='utf-8'))
          ids = {e.attrib.get('id') for e in root.findall('CAbilMorph')}
          assert {'UpgradeToLair', 'UpgradeToHive'} <= ids
          text = p.read_text(encoding='utf-8')
          assert text.count('value="12"') >= 6
          print('TEST Lair/Hive morph data verified')
          PY

      - name: Build StormLib v9.40
        run: |
          git clone --depth 1 --branch v9.40 https://github.com/ladislav-zezula/StormLib.git _StormLib
          cmake -S _StormLib -B _StormLib/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/_storm" \
            -DBUILD_SHARED_LIBS=ON \
            -DSTORM_USE_BUNDLED_LIBRARIES=ON \
            -DSTORM_BUILD_TESTS=OFF
          cmake --build _StormLib/build --config Release -j2
          cmake --install _StormLib/build

      - name: Compile MPQ helper
        run: |
          cc tools/mpq_replace.c \
            -I"$PWD/_storm/include" \
            -L"$PWD/_storm/lib" \
            -Wl,-rpath,"$PWD/_storm/lib" \
            -lstorm -lz \
            -o tools/mpq_replace

      - name: Build Alpha 4.1 map
        run: |
          mkdir -p dist
          OUT='dist/Monobattle - 열대 해안 - Alpha4.1 TEST.SC2Map'
          cp 'Tropic Shores 0.136.SC2Map' "$OUT"
          tools/mpq_replace "$OUT" 'overlay/koKR.SC2Data/LocalizedData/GameStrings.txt' 'koKR.SC2Data\LocalizedData\GameStrings.txt'
          tools/mpq_replace "$OUT" 'overlay/enUS.SC2Data/LocalizedData/GameStrings.txt' 'enUS.SC2Data\LocalizedData\GameStrings.txt'
          tools/mpq_replace "$OUT" 'build/MapScript.galaxy' 'MapScript.galaxy'
          tools/mpq_replace "$OUT" 'overlay/Base.SC2Data/GameData/AbilData.xml' 'Base.SC2Data\GameData\AbilData.xml'

      - name: Verify packaged MPQ
        run: |
          python -m pip install --disable-pip-version-check mpyq
          python - <<'PY'
          from mpyq import MPQArchive
          p = 'dist/Monobattle - 열대 해안 - Alpha4.1 TEST.SC2Map'
          raw = MPQArchive(p).extract()
          files = {(k.decode('utf-8','replace') if isinstance(k,bytes) else str(k)).replace('\\','/'): bytes(v) for k,v in raw.items()}
          s = files['MapScript.galaxy'].decode('utf-8-sig')
          for marker in (
              'bool gv_mbVoteLocked',
              '선택 잠금 · 3초 후 확정',
              '"CinematicLabel"',
              'int[24] gv_mbSDPickBadge',
              'gv_mbSDPickedBy[slot] = player',
              '[BLUE] P', '[RED] P'
          ):
              assert marker in s, marker
          data_path = 'Base.SC2Data/GameData/AbilData.xml'
          assert data_path in files, data_path
          data = files[data_path].decode('utf-8-sig')
          assert 'id="UpgradeToLair"' in data
          assert 'id="UpgradeToHive"' in data
          assert data.count('value="12"') >= 6
          print(f'Alpha 4.1 packaged MPQ verified: {len(files)} entries')
          PY

      - name: Upload Alpha 4.1 map
        uses: actions/upload-artifact@v4
        with:
          name: monobattle-tropic-shores-alpha41-test
          path: 'dist/Monobattle - 열대 해안 - Alpha4.1 TEST.SC2Map'
          if-no-files-found: error
          retention-days: 7
