name: Build Monobattle Alpha 3

on:
  push:
    branches:
      - 'dev/monobattle-v0.1'
    paths:
      - 'overlay/**'
      - 'tools/**'
      - '.github/workflows/build-monobattle.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare and validate Galaxy source
        run: |
          mkdir -p build
          python - <<'PY'
          from pathlib import Path
          import re

          src = Path('overlay/MapScript.galaxy').read_text(encoding='utf-8')
          src = src.replace('Alpha 2: polished UI + Blind Random + Single Draft + first production restriction pass',
                            'Alpha 3: pick-matched starting race + icon Single Draft UI', 1)

          # TextToString exists in the SC2 runtime but is declared in natives_missing rather
          # than the normal natives include. Declare only the one native we use.
          marker = 'include "TriggerLibs/NativeLib"\n'
          if marker not in src:
              raise SystemExit('NativeLib include missing')
          src = src.replace(marker, marker + 'native string TextToString(text inText);\n', 1)

          # Keep the source readable while compiling with conservative Galaxy syntax:
          # use a global quota array instead of passing an array as a function argument.
          global_marker = 'int gv_mbSDPickIndex;\n'
          if global_marker not in src:
              raise SystemExit('SD pick-index global missing')
          src = src.replace(global_marker, global_marker + 'int[3] gv_mbSDQuota;\n', 1)
          src = src.replace('void MB_SDComputeQuotas (int[3] q) {', 'void MB_SDComputeQuotas () {')
          src = src.replace('q[', 'gv_mbSDQuota[')
          src = src.replace('    int[3] quota;\n', '')
          src = src.replace('MB_SDComputeQuotas(quota);', 'MB_SDComputeQuotas();')
          src = src.replace('quota[race - 1]', 'gv_mbSDQuota[race - 1]')

          # The SD board now has one small name label for each icon card.
          button_global = 'int[24] gv_mbSDButton;\n'
          if button_global not in src:
              raise SystemExit('SD button global missing')
          src = src.replace(button_global, button_global + 'int[24] gv_mbSDNameLabel;\n', 1)

          # Convert selected Monobattle unit -> actual melee race and create starting units only
          # after the final pick. This prevents the lobby/random race from leaking into the match.
          helper_anchor = 'bool MB_IsAir (string u) {'
          if helper_anchor not in src:
              raise SystemExit('metadata helper anchor missing')
          helper = r'''string MB_RaceLinkForUnit (string unitId) {
    int race = MB_UnitRace(unitId);
    if (race == MB_RACE_TERRAN) { return "Terr"; }
    if (race == MB_RACE_ZERG) { return "Zerg"; }
    return "Prot";
}

string MB_UnitIcon (string unitId) {
    return CatalogFieldValueGet(c_gameCatalogUnit, unitId, "Icon", c_playerAny);
}

void MB_InitStartingUnitsAll () {
    int p = 1;
    string raceLink;
    while (p <= 8) {
        if (MB_PlayerActive(p) && gv_mbUnit[p] != "") {
            raceLink = MB_RaceLinkForUnit(gv_mbUnit[p]);
            PlayerSetRace(p, raceLink);
            MeleeInitUnitsForPlayer(p, raceLink, PlayerStartLocation(p));
        }
        p += 1;
    }
    MeleeInitAI();
}

'''
          src = src.replace(helper_anchor, helper + helper_anchor, 1)

          # Icon-first Single Draft board. Each card is a real button whose image is the unit icon;
          # names remain as compact supporting labels/tooltips rather than the primary visual cue.
          update_pattern = re.compile(r'void MB_SDUpdateBoardButtons \(\) \{.*?\n\}\n\nvoid MB_SDUpdateOrderText', re.S)
          update_replacement = r'''void MB_SDUpdateBoardButtons () {
    int i = 0;
    string icon;
    string display;
    while (i < MB_SD_CANDIDATES) {
        icon = MB_UnitIcon(gv_mbSDCandidate[i]);
        display = MB_DisplayName(gv_mbSDCandidate[i]);
        DialogControlSetPropertyAsString(gv_mbSDButton[i], c_triggerControlPropertyImage, PlayerGroupAll(), icon);
        DialogControlSetPropertyAsString(gv_mbSDButton[i], c_triggerControlPropertyHoverImage, PlayerGroupAll(), icon);
        DialogControlSetPropertyAsInt(gv_mbSDButton[i], c_triggerControlPropertyImageType, PlayerGroupAll(), c_triggerImageTypeNormal);
        DialogControlSetPropertyAsText(gv_mbSDButton[i], c_triggerControlPropertyText, PlayerGroupAll(), StringToText(""));
        DialogControlSetPropertyAsText(gv_mbSDButton[i], c_triggerControlPropertyTooltip, PlayerGroupAll(), StringToText(display));
        DialogControlSetPropertyAsText(gv_mbSDNameLabel[i], c_triggerControlPropertyText, PlayerGroupAll(), StringToText(display));
        DialogControlSetPropertyAsBool(gv_mbSDButton[i], c_triggerControlPropertyDesaturated, PlayerGroupAll(), gv_mbSDTaken[i]);
        DialogControlSetEnabled(gv_mbSDButton[i], PlayerGroupAll(), false);
        i += 1;
    }
    if (gv_mbSDPickIndex < gv_mbSDOrderCount) {
        i = 0;
        while (i < MB_SD_CANDIDATES) {
            if (!gv_mbSDTaken[i]) {
                DialogControlSetEnabled(gv_mbSDButton[i], PlayerGroupSingle(gv_mbSDOrder[gv_mbSDPickIndex]), true);
            }
            i += 1;
        }
    }
}

void MB_SDUpdateOrderText'''
          src, n = update_pattern.subn(update_replacement, src, count=1)
          if n != 1:
              raise SystemExit(f'failed to replace SD board updater: {n}')

          create_pattern = re.compile(r'void MB_CreateSDUI \(\) \{.*?\n\}\n\n//--------------------------------------------------------------------------------------------------\n// Phase flow', re.S)
          create_replacement = r'''void MB_CreateSDUI () {
    int i = 0;
    int col;
    int row;
    int x;
    int y;
    gv_mbSDDialog = DialogCreate(1060, 650, c_anchorCenter, 0, -5, false);
    DialogSetTransparency(gv_mbSDDialog, 5.0);

    gv_mbSDHeaderPanel = DialogControlCreate(gv_mbSDDialog, c_triggerControlTypePanel);
    DialogControlSetSize(gv_mbSDHeaderPanel, PlayerGroupAll(), 1010, 78);
    DialogControlSetPosition(gv_mbSDHeaderPanel, PlayerGroupAll(), c_anchorTop, 0, 14);
    MB_SetPanelLook(gv_mbSDHeaderPanel);

    gv_mbSDTitle = DialogControlCreate(gv_mbSDDialog, c_triggerControlTypeLabel);
    DialogControlSetSize(gv_mbSDTitle, PlayerGroupAll(), 960, 32);
    DialogControlSetPosition(gv_mbSDTitle, PlayerGroupAll(), c_anchorTop, 0, 25);
    DialogControlSetPropertyAsText(gv_mbSDTitle, c_triggerControlPropertyText, PlayerGroupAll(),
        TextWithColor(StringToText("SINGLE DRAFT"), Color(45.0, 82.0, 100.0)));

    gv_mbSDInfo = DialogControlCreate(gv_mbSDDialog, c_triggerControlTypeLabel);
    DialogControlSetSize(gv_mbSDInfo, PlayerGroupAll(), 960, 26);
    DialogControlSetPosition(gv_mbSDInfo, PlayerGroupAll(), c_anchorTop, 0, 58);

    // 6 x 4 icon-first candidate grid. The 72px icon is the primary identifier;
    // the compact name underneath is only a supporting cue.
    i = 0;
    while (i < MB_SD_CANDIDATES) {
        col = i % 6;
        row = i / 6;
        x = 30 + (col * 108);
        y = 112 + (row * 106);

        gv_mbSDButton[i] = DialogControlCreate(gv_mbSDDialog, c_triggerControlTypeButton);
        DialogControlSetSize(gv_mbSDButton[i], PlayerGroupAll(), 72, 72);
        DialogControlSetPosition(gv_mbSDButton[i], PlayerGroupAll(), c_anchorTopLeft, x + 12, y);
        DialogControlSetPropertyAsBool(gv_mbSDButton[i], c_triggerControlPropertyBorderVisible, PlayerGroupAll(), true);

        gv_mbSDNameLabel[i] = DialogControlCreate(gv_mbSDDialog, c_triggerControlTypeLabel);
        DialogControlSetSize(gv_mbSDNameLabel[i], PlayerGroupAll(), 96, 24);
        DialogControlSetPosition(gv_mbSDNameLabel[i], PlayerGroupAll(), c_anchorTopLeft, x, y + 74);
        i += 1;
    }

    gv_mbSDOrderLabel = DialogControlCreate(gv_mbSDDialog, c_triggerControlTypeLabel);
    DialogControlSetSize(gv_mbSDOrderLabel, PlayerGroupAll(), 320, 350);
    DialogControlSetPosition(gv_mbSDOrderLabel, PlayerGroupAll(), c_anchorTopLeft, 720, 108);

    gv_mbSDCurrentLabel = DialogControlCreate(gv_mbSDDialog, c_triggerControlTypeLabel);
    DialogControlSetSize(gv_mbSDCurrentLabel, PlayerGroupAll(), 320, 54);
    DialogControlSetPosition(gv_mbSDCurrentLabel, PlayerGroupAll(), c_anchorTopLeft, 720, 475);

    gv_mbSDHintLabel = DialogControlCreate(gv_mbSDDialog, c_triggerControlTypeLabel);
    DialogControlSetSize(gv_mbSDHintLabel, PlayerGroupAll(), 650, 62);
    DialogControlSetPosition(gv_mbSDHintLabel, PlayerGroupAll(), c_anchorTopLeft, 30, 548);
    DialogControlSetPropertyAsText(gv_mbSDHintLabel, c_triggerControlPropertyText, PlayerGroupAll(),
        StringToText("아이콘에 마우스를 올리면 유닛명을 확인할 수 있습니다\n후보 24개 · 전원 고유 유닛 · 공중 4~10 · 순수 캐스터 최대 4"));

    DialogSetVisible(gv_mbSDDialog, PlayerGroupAll(), false);
}

//--------------------------------------------------------------------------------------------------
// Phase flow'''
          src, n = create_pattern.subn(create_replacement, src, count=1)
          if n != 1:
              raise SystemExit(f'failed to replace SD UI creation: {n}')

          # Final selection now determines the player's actual melee race before the town hall and
          # workers are spawned. This applies equally to Blind Random and Single Draft.
          finish_old = '''    DialogSetVisible(gv_mbBlindDialog, PlayerGroupAll(), false);\n    DialogSetVisible(gv_mbSDDialog, PlayerGroupAll(), false);\n    MB_ApplyProductionRestrictionsAll();\n'''
          finish_new = '''    DialogSetVisible(gv_mbBlindDialog, PlayerGroupAll(), false);\n    DialogSetVisible(gv_mbSDDialog, PlayerGroupAll(), false);\n    MB_InitStartingUnitsAll();\n    MB_ApplyProductionRestrictionsAll();\n'''
          if finish_old not in src:
              raise SystemExit('finish-selection anchor missing')
          src = src.replace(finish_old, finish_new, 1)

          # Do NOT create lobby-race starting units before the pick. Resources can be initialized
          # immediately, but starting units and melee AI wait until MB_InitStartingUnitsAll().
          if '    MeleeInitUnits();\n' not in src:
              raise SystemExit('early MeleeInitUnits anchor missing')
          src = src.replace('    MeleeInitUnits();\n', '', 1)
          src = src.replace('    MeleeInitAI();\n', '', 1)

          # Use Blizzard StandardTemplates for the large vote/Blind cards. SD intentionally uses
          # plain image-backed buttons so each candidate can display its actual unit icon.
          replacements = {
              'DialogControlCreate(gv_mbVoteDialog, c_triggerControlTypeButton)':
                  'DialogControlCreateFromTemplate(gv_mbVoteDialog, c_triggerControlTypeButton, "StandardTemplates/StandardButtonTemplate")',
              'DialogControlCreate(gv_mbBlindDialog, c_triggerControlTypeButton)':
                  'DialogControlCreateFromTemplate(gv_mbBlindDialog, c_triggerControlTypeButton, "StandardTemplates/StandardButtonTemplate")',
          }
          for old, new in replacements.items():
              src = src.replace(old, new)

          # Basic Galaxy/source invariants before repacking.
          if src.count('gv_mbTimer = TimerCreate();') != 1:
              raise SystemExit('expected exactly one Monobattle timer creation')
          if 'MeleeInitOptions();' in src:
              raise SystemExit('stock melee victory logic must remain disabled')
          if '    MeleeInitUnits();' in src:
              raise SystemExit('lobby-race starting units are still created early')
          if 'int[3] q' in src or 'int[3] quota' in src:
              raise SystemExit('array-parameter/local quota compatibility transform failed')
          for required in (
              'MB_StartVote', 'MB_StartBlind', 'MB_StartSD', 'MB_SDGenerateInitialBoard',
              'MB_SDPickSlot', 'MB_SDAutoPick', 'MB_ApplyProductionRestrictionsAll',
              'MB_InitStartingUnitsAll', 'MeleeInitUnitsForPlayer', 'PlayerSetRace',
              'MB_UnitIcon', 'c_triggerControlPropertyImage', 'gv_mbSDNameLabel',
              'TechTreeUnitAllow', 'MB_RerollPlayer'
          ):
              if required not in src:
                  raise SystemExit(f'missing Alpha 3 marker: {required}')

          # Crude but useful structural sanity check for braces outside comments/strings.
          no_strings = re.sub(r'"(?:\\.|[^"\\])*"', '""', src)
          no_comments = re.sub(r'//.*', '', no_strings)
          if no_comments.count('{') != no_comments.count('}'):
              raise SystemExit('unbalanced Galaxy braces')

          # UI geometry: 6x4 icon cards occupy x=30..666 and y=112..504, safely left of pick order.
          assert 30 + 108*5 + 96 <= 720
          assert 112 + 106*3 + 98 <= 548
          assert 720 + 320 <= 1060

          Path('build/MapScript.galaxy').write_text(src, encoding='utf-8', newline='\n')
          print('Galaxy source prepared: pick-matched starting race + icon-first SD board')
          PY

      - name: Validate draft rules with simulation
        run: |
          python - <<'PY'
          import random

          T = ['Marine','Marauder','Reaper','Hellion','WidowMine','SiegeTank','Cyclone','Thor','VikingFighter','Banshee','Raven','Battlecruiser','Liberator','Ghost','Hellbat']
          Z = ['Zergling','Baneling','Roach','Ravager','Hydralisk','LurkerMP','Infestor','SwarmHostMP','Ultralisk','Mutalisk','Corruptor','BroodLord','Viper','Queen']
          P = ['Zealot','Stalker','Sentry','Adept','HighTemplar','DarkTemplar','Archon','Immortal','Colossus','Disruptor','Phoenix','VoidRay','Oracle','Tempest','Carrier']
          pools = [T,Z,P]
          total = sum(map(len,pools))
          quotas = [24*len(x)//total for x in pools]
          rem = [24*len(x)%total for x in pools]
          while sum(quotas) < 24:
              i = max(range(3), key=lambda x: rem[x])
              quotas[i] += 1
              rem[i] = -1
          if quotas != [8,8,8]:
              raise SystemExit(f'unexpected current quotas: {quotas}')

          air = set(['VikingFighter','Banshee','Raven','Battlecruiser','Liberator','Mutalisk','Corruptor','BroodLord','Viper','Phoenix','VoidRay','Oracle','Tempest','Carrier'])
          caster = set(['Raven','Infestor','Viper','HighTemplar'])
          hybrid = set(['WidowMine','Ghost','Queen','SwarmHostMP','Sentry','Disruptor','Oracle'])
          high = set(['Raven','Infestor','Viper','HighTemplar','Disruptor','Oracle'])
          reliable = set(['Marine','WidowMine','Cyclone','Thor','VikingFighter','Battlecruiser','Liberator','Ghost','Hydralisk','Mutalisk','Corruptor','Queen','Stalker','Sentry','Archon','Phoenix','VoidRay','Tempest','Carrier'])
          conditional = set(['Infestor','Viper','HighTemplar'])

          def ok(board):
              nair = sum(u in air for u in board)
              ndirect = sum(u not in caster and u not in hybrid for u in board)
              ncast = sum(u in caster for u in board)
              nhigh = sum(u in high for u in board)
              nrel = sum(u in reliable for u in board)
              aa2 = sum(2 if u in reliable else 1 if u in conditional else 0 for u in board)
              return 4 <= nair <= 10 and ndirect >= 15 and ncast <= 4 and nhigh <= 6 and nrel >= 4 and aa2 >= 10

          hits = 0
          for _ in range(20000):
              board = []
              for pool,q in zip(pools,quotas):
                  board.extend(random.sample(pool,q))
              if len(board) != len(set(board)):
                  raise SystemExit('duplicate draft candidate')
              if ok(board): hits += 1
          if hits == 0:
              raise SystemExit('draft constraints appear unsatisfiable')
          print(f'Legal SD boards observed: {hits}/20000')
          PY

      - name: Build StormLib v9.40
        run: |
          git clone --depth 1 --branch v9.40 https://github.com/ladislav-zezula/StormLib.git _StormLib
          cmake -S _StormLib -B _StormLib/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/_storm" \
            -DBUILD_SHARED_LIBS=ON \
            -DSTORM_USE_BUNDLED_LIBRARIES=ON \
            -DSTORM_BUILD_TESTS=OFF
          cmake --build _StormLib/build --config Release -j2
          cmake --install _StormLib/build

      - name: Compile MPQ replacement helper
        run: |
          cc tools/mpq_replace.c \
            -I"$PWD/_storm/include" \
            -L"$PWD/_storm/lib" \
            -Wl,-rpath,"$PWD/_storm/lib" \
            -lstorm -lz \
            -o tools/mpq_replace

      - name: Build Alpha 3 map
        run: |
          mkdir -p dist
          OUT='dist/Monobattle - 열대 해안 - Alpha3.SC2Map'
          cp 'Tropic Shores 0.136.SC2Map' "$OUT"

          tools/mpq_replace "$OUT" \
            'overlay/koKR.SC2Data/LocalizedData/GameStrings.txt' \
            'koKR.SC2Data\LocalizedData\GameStrings.txt'
          tools/mpq_replace "$OUT" \
            'overlay/enUS.SC2Data/LocalizedData/GameStrings.txt' \
            'enUS.SC2Data\LocalizedData\GameStrings.txt'
          tools/mpq_replace "$OUT" \
            'build/MapScript.galaxy' \
            'MapScript.galaxy'

          sha256sum 'Tropic Shores 0.136.SC2Map' "$OUT"

      - name: Verify rebuilt MPQ
        run: |
          python -m pip install --disable-pip-version-check mpyq
          python - <<'PY'
          from mpyq import MPQArchive
          from pathlib import Path

          p = Path('dist/Monobattle - 열대 해안 - Alpha3.SC2Map')
          raw = MPQArchive(str(p)).extract()
          files = {}
          for k,v in raw.items():
              key = k.decode('utf-8','replace') if isinstance(k,bytes) else str(k)
              files[key.replace('\\','/')] = bytes(v)

          for required in ('MapScript.galaxy','MapInfo','Objects','t3Terrain.xml','koKR.SC2Data/LocalizedData/GameStrings.txt'):
              if required not in files:
                  raise SystemExit(f'missing MPQ entry: {required}')

          script = files['MapScript.galaxy'].decode('utf-8-sig')
          for marker in (
              'MB_StartSD','MB_SDGenerateInitialBoard','MB_ApplyProductionRestrictionsAll',
              'MB_InitStartingUnitsAll','MeleeInitUnitsForPlayer','PlayerSetRace',
              'MB_UnitIcon','gv_mbSDNameLabel','c_triggerControlPropertyImage'
          ):
              if marker not in script:
                  raise SystemExit(f'missing packaged marker: {marker}')
          if '    MeleeInitUnits();' in script:
              raise SystemExit('early lobby-race starting units still packaged')
          if 'MeleeInitOptions();' in script:
              raise SystemExit('stock melee result logic accidentally restored')
          if script.count('gv_mbTimer = TimerCreate();') != 1:
              raise SystemExit('timer count regression')

          ko = files['koKR.SC2Data/LocalizedData/GameStrings.txt'].decode('utf-8-sig')
          if 'DocInfo/Name=Monobattle - 열대 해안' not in ko:
              raise SystemExit('localized map name missing')
          print(f'Alpha 3 MPQ verified: {len(files)} entries')
          PY

      - name: Upload Alpha 3 map
        uses: actions/upload-artifact@v4
        with:
          name: monobattle-tropic-shores-alpha3
          path: 'dist/Monobattle - 열대 해안 - Alpha3.SC2Map'
          if-no-files-found: error
          retention-days: 7
