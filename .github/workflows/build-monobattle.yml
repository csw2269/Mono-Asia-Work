name: Build Monobattle Alpha 3.4

on:
  push:
    branches:
      - 'dev/monobattle-v0.1'
    paths:
      - 'overlay/**'
      - 'tools/**'
      - '.github/workflows/build-monobattle.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare and validate Galaxy source
        run: python tools/prepare_alpha34.py

      - name: Validate draft rules with simulation
        run: |
          python - <<'PY'
          import random
          T = ['Marine','Marauder','Reaper','Hellion','WidowMine','SiegeTank','Cyclone','Thor','VikingFighter','Banshee','Raven','Battlecruiser','Liberator','Ghost','HellionTank']
          Z = ['Zergling','Baneling','Roach','Ravager','Hydralisk','LurkerMP','Infestor','SwarmHostMP','Ultralisk','Mutalisk','Corruptor','BroodLord','Viper','Queen']
          P = ['Zealot','Stalker','Sentry','Adept','HighTemplar','DarkTemplar','Archon','Immortal','Colossus','Disruptor','Phoenix','VoidRay','Oracle','Tempest','Carrier']
          pools = [T,Z,P]
          total = sum(map(len,pools))
          quotas = [24*len(x)//total for x in pools]
          rem = [24*len(x)%total for x in pools]
          while sum(quotas) < 24:
              i = max(range(3), key=lambda x: rem[x])
              quotas[i] += 1
              rem[i] = -1
          air = {'VikingFighter','Banshee','Raven','Battlecruiser','Liberator','Mutalisk','Corruptor','BroodLord','Viper','Phoenix','VoidRay','Oracle','Tempest','Carrier'}
          caster = {'Raven','Infestor','Viper','HighTemplar'}
          hybrid = {'WidowMine','Ghost','Queen','SwarmHostMP','Sentry','Disruptor','Oracle'}
          high = {'Raven','Infestor','Viper','HighTemplar','Disruptor','Oracle'}
          reliable = {'Marine','WidowMine','Cyclone','Thor','VikingFighter','Battlecruiser','Liberator','Ghost','Hydralisk','Mutalisk','Corruptor','Queen','Stalker','Sentry','Archon','Phoenix','VoidRay','Tempest','Carrier'}
          conditional = {'Infestor','Viper','HighTemplar'}
          def ok(board):
              nair = sum(u in air for u in board)
              ndirect = sum(u not in caster and u not in hybrid for u in board)
              ncast = sum(u in caster for u in board)
              nhigh = sum(u in high for u in board)
              nrel = sum(u in reliable for u in board)
              aa2 = sum(2 if u in reliable else 1 if u in conditional else 0 for u in board)
              return 4 <= nair <= 10 and ndirect >= 15 and ncast <= 4 and nhigh <= 6 and nrel >= 4 and aa2 >= 10
          hits = 0
          for _ in range(10000):
              board = []
              for pool,q in zip(pools,quotas):
                  board.extend(random.sample(pool,q))
              if ok(board): hits += 1
          if hits == 0:
              raise SystemExit('draft constraints appear unsatisfiable')
          print(f'Legal SD boards observed: {hits}/10000')
          PY

      - name: Build StormLib v9.40
        run: |
          git clone --depth 1 --branch v9.40 https://github.com/ladislav-zezula/StormLib.git _StormLib
          cmake -S _StormLib -B _StormLib/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/_storm" \
            -DBUILD_SHARED_LIBS=ON \
            -DSTORM_USE_BUNDLED_LIBRARIES=ON \
            -DSTORM_BUILD_TESTS=OFF
          cmake --build _StormLib/build --config Release -j2
          cmake --install _StormLib/build

      - name: Compile MPQ replacement helper
        run: |
          cc tools/mpq_replace.c \
            -I"$PWD/_storm/include" \
            -L"$PWD/_storm/lib" \
            -Wl,-rpath,"$PWD/_storm/lib" \
            -lstorm -lz \
            -o tools/mpq_replace

      - name: Build Alpha 3.4 map
        run: |
          mkdir -p dist
          OUT='dist/Monobattle - 열대 해안 - Alpha3.4.SC2Map'
          cp 'Tropic Shores 0.136.SC2Map' "$OUT"
          tools/mpq_replace "$OUT" 'overlay/koKR.SC2Data/LocalizedData/GameStrings.txt' 'koKR.SC2Data\LocalizedData\GameStrings.txt'
          tools/mpq_replace "$OUT" 'overlay/enUS.SC2Data/LocalizedData/GameStrings.txt' 'enUS.SC2Data\LocalizedData\GameStrings.txt'
          tools/mpq_replace "$OUT" 'build/MapScript.galaxy' 'MapScript.galaxy'
          sha256sum "$OUT"

      - name: Verify rebuilt MPQ
        run: |
          python -m pip install --disable-pip-version-check mpyq
          python - <<'PY'
          from mpyq import MPQArchive
          p = 'dist/Monobattle - 열대 해안 - Alpha3.4.SC2Map'
          raw = MPQArchive(p).extract()
          files = {}
          for k,v in raw.items():
              key = k.decode('utf-8','replace') if isinstance(k,bytes) else str(k)
              files[key.replace('\\','/')] = bytes(v)
          script = files['MapScript.galaxy'].decode('utf-8-sig')
          for marker in (
              'MB_InitStartingUnitsAll','MeleeInitUnitsForPlayer','PlayerSetRace',
              'MB_UnitButtonId','c_gameCatalogButton','CatalogEntryIsValid',
              'btn-unit-protoss-adept.dds','btn-unit-protoss-disruptor.dds',
              'MB_CreateRosterUI','MB_UpdateRosterAll',
              'MB_ApplySupportRulesAll','MedivacHeal','MedivacSpeedBoost'
          ):
              assert marker in script, marker
          assert '"Hellbat"' not in script
          assert '"HellionTank"' in script
          assert '    MeleeInitUnits();' not in script
          assert 'MeleeInitOptions();' not in script
          assert 'UnitPauseAll(' not in script
          assert script.count('gv_mbTimer = TimerCreate();') == 1
          print('Alpha 3.4 MPQ verified')
          PY

      - name: Upload Alpha 3.4 map
        uses: actions/upload-artifact@v4
        with:
          name: monobattle-tropic-shores-alpha34
          path: 'dist/Monobattle - 열대 해안 - Alpha3.4.SC2Map'
          if-no-files-found: error
          retention-days: 7
