name: Build Monobattle Alpha

on:
  push:
    branches:
      - 'dev/monobattle-v0.1'
    paths:
      - 'overlay/**'
      - 'tools/**'
      - '.github/workflows/build-monobattle.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build StormLib v9.40
        run: |
          git clone --depth 1 --branch v9.40 https://github.com/ladislav-zezula/StormLib.git _StormLib
          cmake -S _StormLib -B _StormLib/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/_storm" \
            -DBUILD_SHARED_LIBS=ON \
            -DSTORM_USE_BUNDLED_LIBRARIES=ON \
            -DSTORM_BUILD_TESTS=OFF
          cmake --build _StormLib/build --config Release -j2
          cmake --install _StormLib/build

      - name: Compile MPQ replacement helper
        run: |
          cc tools/mpq_replace.c \
            -I"$PWD/_storm/include" \
            -L"$PWD/_storm/lib" \
            -Wl,-rpath,"$PWD/_storm/lib" \
            -lstorm -lz \
            -o tools/mpq_replace

      - name: Build Alpha 1 map
        run: |
          mkdir -p dist
          OUT='dist/Monobattle - 열대 해안 - Alpha1.SC2Map'
          cp 'Tropic Shores 0.136.SC2Map' "$OUT"

          tools/mpq_replace "$OUT" \
            'overlay/koKR.SC2Data/LocalizedData/GameStrings.txt' \
            'koKR.SC2Data\LocalizedData\GameStrings.txt'

          tools/mpq_replace "$OUT" \
            'overlay/enUS.SC2Data/LocalizedData/GameStrings.txt' \
            'enUS.SC2Data\LocalizedData\GameStrings.txt'

          tools/mpq_replace "$OUT" \
            'overlay/MapScript.galaxy' \
            'MapScript.galaxy'

          sha256sum 'Tropic Shores 0.136.SC2Map' "$OUT"

      - name: Verify Alpha 1 MPQ
        run: |
          python -m pip install --disable-pip-version-check mpyq
          python - <<'PY'
          from mpyq import MPQArchive
          from pathlib import Path

          p = Path('dist/Monobattle - 열대 해안 - Alpha1.SC2Map')
          files = MPQArchive(str(p)).extract()
          normalized = {}
          for k, v in files.items():
              key = k.decode('utf-8', 'replace') if isinstance(k, bytes) else str(k)
              normalized[key.replace('\\', '/')] = bytes(v)

          required = [
              'MapScript.galaxy',
              'MapInfo',
              'Objects',
              't3Terrain.xml',
              'koKR.SC2Data/LocalizedData/GameStrings.txt',
              'enUS.SC2Data/LocalizedData/GameStrings.txt',
          ]
          for name in required:
              if name not in normalized:
                  raise SystemExit(f'missing required MPQ entry: {name}')

          script = normalized['MapScript.galaxy'].decode('utf-8-sig')
          for marker in ['MB_StartVote', 'MB_StartBlind', 'MB_RerollPlayer', 'MeleeInitResources']:
              if marker not in script:
                  raise SystemExit(f'MapScript marker missing: {marker}')

          ko = normalized['koKR.SC2Data/LocalizedData/GameStrings.txt'].decode('utf-8-sig')
          if 'DocInfo/Name=Monobattle - 열대 해안' not in ko:
              raise SystemExit('koKR map name missing')

          print(f'Alpha 1 verified: {len(normalized)} MPQ entries')
          PY

      - name: Upload Alpha 1 map
        uses: actions/upload-artifact@v4
        with:
          name: monobattle-tropic-shores-alpha1
          path: 'dist/Monobattle - 열대 해안 - Alpha1.SC2Map'
          if-no-files-found: error
          retention-days: 7
